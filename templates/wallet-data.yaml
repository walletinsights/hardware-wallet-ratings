# WalletInsights — wallet data template
# One file per model. Definitions and points: MANUFACTURERS.md
# For every field: value (true / false / text / number, or null if unknown),
# source (public URL) and, when the feature depends on firmware, since_firmware.
# Leave null rather than guess. Fields without a public source score 0.

identity:
  # Model name
  name: { value: null, source: "", since_firmware: "" }
  # Brand
  brand: { value: null, source: "", since_firmware: "" }
  # Year of release
  release_year: { value: null, source: "", since_firmware: "" }
  # List price on the official store, USD, no temporary discounts
  price_usd: { value: null, source: "", since_firmware: "" }
  # true if no longer sold
  discontinued: { value: null, source: "", since_firmware: "" }
  # Official product page
  product_url: { value: null, source: "", since_firmware: "" }

