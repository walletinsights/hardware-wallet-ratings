name: New model
description: Submit a hardware wallet that is not in the data yet
title: "[New model] <brand> <model>"
labels: ["new-model"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the data sheet [templates/wallet-data.xlsx](https://github.com/walletinsights/hardware-wallet-ratings/raw/main/templates/wallet-data.xlsx) and attach it below. Unknown fields stay empty; they score 0 until a public source exists. Prefer email? Send it to contact@walletinsights.io.
  - type: input
    id: model
    attributes:
      label: Brand and model
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official product page
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data file
      description: Attach the filled sheet (.xlsx)
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the product
      options:
        - Manufacturer
        - User
        - Other
    validations:
      required: true
