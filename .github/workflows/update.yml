name: Refresh data

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "WalletInsights"
          git config user.email "contact@walletinsights.io"
          git add data README.md
          git commit -m "data: refresh $(date -u +%F)"
          git push
      - name: Archive on Zenodo when the data changed enough
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python3 scripts/zenodo.py
